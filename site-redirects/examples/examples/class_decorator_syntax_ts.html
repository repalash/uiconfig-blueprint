<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>uiconfig-blueprint moved</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://repalash.com/uiconfig.js/examples/decorators.html?renderer=blueprint">
<meta http-equiv="refresh" content="0; url=https://repalash.com/uiconfig.js/examples/decorators.html?renderer=blueprint">
<script>
(function () {
    var u = new URL("https://repalash.com/uiconfig.js/examples/decorators.html?renderer=blueprint");
    new URLSearchParams(location.search).forEach(function (v, k) { if (!u.searchParams.has(k)) u.searchParams.set(k, v) });
    u.hash = location.hash;
    location.replace(u.href);
})();
</script>
</head>
<body>
<p>This page moved to <a href="https://repalash.com/uiconfig.js/examples/decorators.html?renderer=blueprint">https://repalash.com/uiconfig.js/examples/decorators.html?renderer=blueprint</a>.</p>
</body>
</html>
